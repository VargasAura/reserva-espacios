spring:
  application:
    name: reserva-espacios
  datasource:
    # Base de datos en archivo: los datos se conservan al reiniciar. No hay que instalar nada.
    url: jdbc:h2:file:./data/reservas;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false
    # Correo SMTP: solo se usa si app.notificaciones.modo = real. Nunca escribas la clave aquí: usa variables de entorno.
    mail:
      host: ${MAIL_HOST:smtp.gmail.com}
      port: ${MAIL_PORT:587}
      username: ${MAIL_USUARIO:}   # tu correo de envío
      password: ${MAIL_CLAVE:}     # en Gmail: "contraseña de aplicación", no la normal
      properties:
        mail.smtp.auth: true
        mail.smtp.starttls.enable: true

server:
  port: 8080
  servlet:
    session:
      timeout: 30m   # REQ-6: cierre de sesión por inactividad


app:
  notificaciones:
    # simulado = solo escribe en el log y lo da por enviado (por defecto) | real = envía correo por SMTP
    modo: ${NOTIFICACIONES_MODO:simulado}
    # Dirección "De:" del correo (si lo dejas vacío usa spring.mail.username)
    remitente: ${spring.mail.username:no-reply@reservas.uis.edu.co}