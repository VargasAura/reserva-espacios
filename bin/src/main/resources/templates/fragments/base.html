<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="cabecera(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · Reserva de Espacios'">Reserva de Espacios</title>
  <link rel="stylesheet" th:href="@{/css/tema.css}">
</head>
<body>

<!-- Barra de navegación: se incluye en todas las páginas con th:replace -->
<nav class="navbar" th:fragment="navbar">
  <span class="marca">🌿 Reserva de Espacios</span>
  <a th:href="@{/inicio}">Inicio</a>
  <a th:href="@{/calendario}">Calendario</a>
  <a th:href="@{/reservas}">Mis reservas</a>
  <a th:href="@{/perfil}">Mi perfil</a>
  <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/espacios}">Espacios</a>
  <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/usuarios}">Usuarios</a>
  <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/reportes}">Reportes</a>
  <form th:action="@{/logout}" method="post">
    <button class="btn-salir" type="submit">Cerrar sesión</button>
  </form>
</nav>

</body>
</html>
