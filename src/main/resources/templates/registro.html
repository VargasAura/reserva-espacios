<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabecera('Registro')}"></head>
<body>
<main class="formulario tarjeta acento tierra">
  <h1>Crear cuenta</h1>
  <form th:action="@{/registro}" th:object="${registroForm}" method="post" novalidate>

    <label for="nombre">Nombre completo</label>
    <input id="nombre" type="text" th:field="*{nombre}">
    <div class="error-campo" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>

    <label for="email">Correo electrónico</label>
    <input id="email" type="email" th:field="*{email}">
    <div class="error-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

    <label for="password">Contraseña</label>
    <input id="password" type="password" th:field="*{password}">
    <div class="error-campo" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

    <label for="telefono">Teléfono</label>
    <input id="telefono" type="tel" th:field="*{telefono}">
    <div class="error-campo" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>

    <label class="check">
      <input type="checkbox" th:field="*{aceptaPolitica}">
      <span>Acepto la política de tratamiento de datos personales</span>
    </label>
    <div class="error-campo" th:if="${#fields.hasErrors('aceptaPolitica')}" th:errors="*{aceptaPolitica}"></div>

    <button class="btn tierra ancho" type="submit">Registrarme</button>
  </form>
  <p style="text-align:center;margin-bottom:0">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
</main>
</body>
</html>
