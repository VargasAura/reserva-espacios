<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabecera('Iniciar sesión')}"></head>
<body>
<main class="formulario tarjeta acento">
  <h1>🌿 Bienvenido</h1>
  <p>Reserva salas, auditorios y canchas de tu comunidad.</p>

  <!-- REQ-5: mensaje genérico, no revela si falló el correo o la contraseña -->
  <div class="aviso error" th:if="${param.error}">Correo o contraseña incorrectos.</div>
  <div class="aviso ok" th:if="${param.registrado}">Cuenta creada. Ya puedes iniciar sesión.</div>
  <div class="aviso ok" th:if="${param.salio}">Cerraste sesión correctamente.</div>
  <div class="aviso ok" th:if="${param.restablecida}">Contraseña actualizada. Ya puedes iniciar sesión.</div>

  <form th:action="@{/login}" method="post">
    <label for="username">Correo electrónico</label>
    <input id="username" name="username" type="email" required autofocus>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" required>
    <button class="btn ancho" type="submit">Entrar</button>
  </form>
  <p style="text-align:center"><a th:href="@{/olvide-contrasena}">¿Olvidaste tu contraseña?</a></p>
  <p style="text-align:center;margin-bottom:0">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
</main>
</body>
</html>
