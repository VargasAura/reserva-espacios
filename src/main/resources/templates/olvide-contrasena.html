<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabecera('Recuperar contraseña')}"></head>
<body>
<main class="formulario tarjeta acento">
  <h1>¿Olvidaste tu contraseña?</h1>

  <div class="aviso ok" th:if="${enviado}">
    Te enviamos un enlace para elegir una contraseña nueva a <strong th:text="${correoEnviado}">tu correo</strong>.
    Revisa tu bandeja de entrada (y la carpeta de spam). El enlace vence en 1 hora.
  </div>

  <th:block th:unless="${enviado}">
    <p>Escribe tu correo y te enviaremos un enlace para recuperarla.</p>
    <form th:action="@{/olvide-contrasena}" th:object="${olvideForm}" method="post" novalidate>
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" th:field="*{email}" autofocus>
      <div class="error-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
      <button class="btn ancho" type="submit">Enviar enlace</button>
    </form>
  </th:block>

  <p style="text-align:center;margin-bottom:0"><a th:href="@{/login}">Volver a iniciar sesión</a></p>
</main>
</body>
</html>
