<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabecera('Reserva')}"></head>
<body>
<nav th:replace="~{fragments/base :: navbar}"></nav>
<link rel="stylesheet" th:href="@{/css/reservas.css}">
<main class="contenedor">
    <div class="tarjeta acento form-reserva">

        <h1 th:text="${reservaForm.id != null} ? 'Editar reserva' : 'Nueva reserva'">Nueva reserva</h1>

        <form th:object="${reservaForm}"
              th:action="${reservaForm.id != null} ? @{/reservas/{id}(id=${reservaForm.id})} : @{/reservas}"
              method="post" novalidate>

            <!-- Error de regla o conflicto de horario (REQ-16, REQ-21) -->
            <div class="aviso error destacado" th:if="${#fields.hasGlobalErrors()}">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</div>
            </div>

            <!-- Espacio (REQ-15). Al editar no se puede cambiar: se muestra bloqueado y se envía oculto. -->
            <label for="espacioId">Espacio</label>
            <th:block th:if="${reservaForm.id == null}">
                <select id="espacioId" th:field="*{espacioId}">
                    <option value="">Selecciona un espacio…</option>
                    <option th:each="e : ${espacios}" th:value="${e.id}"
                            th:text="${e.nombre} + ' · ' + ${e.tipo.etiqueta} + ' (' + ${e.capacidad} + ' personas)'"></option>
                </select>
                <div class="error-campo" th:if="${#fields.hasErrors('espacioId')}" th:errors="*{espacioId}"></div>
            </th:block>
            <th:block th:unless="${reservaForm.id == null}">
                <select id="espacioVista" disabled>
                    <option th:each="e : ${espacios}" th:value="${e.id}" th:text="${e.nombre}"
                            th:selected="${e.id == reservaForm.espacioId}"></option>
                </select>
                <input type="hidden" th:field="*{espacioId}">
                <p class="nota">El espacio no se puede cambiar al editar. Si necesitas otro, cancela esta reserva y crea una nueva.</p>
            </th:block>

            <label for="fecha">Fecha</label>
            <input id="fecha" type="date" th:field="*{fecha}"
                   th:min="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}">
            <div class="error-campo" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></div>

            <div class="fila-horas">
                <div>
                    <label for="horaInicioHora">Hora de inicio</label>
                    <div class="hora12">
                        <input type="hidden" id="horaInicio" name="horaInicio"
                               th:value="${reservaForm.horaInicio != null} ? ${#temporals.format(reservaForm.horaInicio, 'HH:mm')} : ''">
                        <select class="h12-hora" id="horaInicioHora" aria-label="Hora de inicio"></select>
                        <select class="h12-ap" aria-label="a. m. o p. m. de inicio"></select>
                    </div>
                    <div class="error-campo" th:if="${#fields.hasErrors('horaInicio')}" th:errors="*{horaInicio}"></div>
                </div>
                <div>
                    <label for="horaFinHora">Hora de fin</label>
                    <div class="hora12">
                        <input type="hidden" id="horaFin" name="horaFin"
                               th:value="${reservaForm.horaFin != null} ? ${#temporals.format(reservaForm.horaFin, 'HH:mm')} : ''">
                        <select class="h12-hora" id="horaFinHora" aria-label="Hora de fin"></select>
                        <select class="h12-ap" aria-label="a. m. o p. m. de fin"></select>
                    </div>
                    <div class="error-campo" th:if="${#fields.hasErrors('horaFin')}" th:errors="*{horaFin}"></div>
                </div>
            </div>

            <div class="botones-form">
                <button class="btn" type="submit"
                        th:text="${reservaForm.id != null} ? 'Guardar cambios' : 'Reservar'">Reservar</button>
                <a class="btn borde" th:href="@{/reservas}">Cancelar</a>
            </div>
        </form>
    </div>
</main>
<div class="pie">Sistema de Reserva de Espacios Compartidos</div>
<script th:src="@{/js/hora12.js}"></script>
</body>
</html>
