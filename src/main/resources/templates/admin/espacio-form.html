<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabecera('Espacio')}"></head>
<body>
<nav th:replace="~{fragments/base :: navbar}"></nav>
<main class="contenedor">
    <div class="tarjeta acento" style="max-width: 560px; margin: 0 auto;">

        <h1 th:text="${espacioForm.id != null} ? 'Editar espacio' : 'Nuevo espacio'">Nuevo espacio</h1>

        <form th:object="${espacioForm}"
              th:action="${espacioForm.id != null} ? @{/admin/espacios/{id}(id=${espacioForm.id})} : @{/admin/espacios}"
              method="post" novalidate>

            <!-- Error de regla (por ejemplo, nombre repetido) (REQ-41) -->
            <div class="aviso error" th:if="${#fields.hasGlobalErrors()}">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</div>
            </div>

            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" th:field="*{nombre}" maxlength="100">
            <div class="error-campo" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>

            <label for="tipo">Tipo</label>
            <select id="tipo" th:field="*{tipo}">
                <option value="">Selecciona un tipo…</option>
                <option th:each="t : ${tipos}" th:value="${t.name()}" th:text="${t.etiqueta}"></option>
            </select>
            <div class="error-campo" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>

            <label for="capacidad">Capacidad (número de personas)</label>
            <input id="capacidad" type="text" inputmode="numeric" th:field="*{capacidad}">
            <div class="error-campo" th:if="${capacidadNoNumerica}">La capacidad debe ser un número entero mayor que cero.</div>
            <div class="error-campo" th:if="${#fields.hasErrors('capacidad') and capacidadNoNumerica == null}"
                 th:errors="*{capacidad}"></div>

            <label for="ubicacion">Ubicación</label>
            <input id="ubicacion" type="text" th:field="*{ubicacion}" maxlength="150">
            <div class="error-campo" th:if="${#fields.hasErrors('ubicacion')}" th:errors="*{ubicacion}"></div>

            <div style="display:flex; flex-wrap:wrap; gap:.6rem; margin-top:1.4rem">
                <button class="btn" type="submit" th:text="${espacioForm.id != null} ? 'Guardar cambios' : 'Crear espacio'">Guardar</button>
                <a class="btn borde" th:href="@{/admin/espacios}">Cancelar</a>
            </div>
        </form>
    </div>
</main>
<div class="pie">Sistema de Reserva de Espacios Compartidos · UIS</div>
</body>
</html>
